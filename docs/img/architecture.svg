<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FactoryX frontend architecture</title>
  <desc id="d">Four layers: View, Control, Model and Service. View calls Control, Control uses Model and Service, Service talks to the backend.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- View -->
  <rect x="40" y="20" width="820" height="110" rx="10" fill="#e8f0ff" stroke="#2f7cf6" stroke-width="2"/>
  <text x="60" y="48" font-size="18" font-weight="700" fill="#1d3a7a">VIEW</text>
  <text x="60" y="68" font-size="13" fill="#334155">components/ · features/*/views</text>
  <rect x="60" y="80" width="240" height="38" rx="6" fill="#fff" stroke="#93b4f0"/>
  <text x="180" y="104" font-size="13" text-anchor="middle" fill="#16213d">Common components</text>
  <rect x="330" y="80" width="240" height="38" rx="6" fill="#fff" stroke="#93b4f0"/>
  <text x="450" y="104" font-size="13" text-anchor="middle" fill="#16213d">Specialized components</text>
  <rect x="600" y="80" width="240" height="38" rx="6" fill="#fff" stroke="#93b4f0"/>
  <text x="720" y="104" font-size="13" text-anchor="middle" fill="#16213d">Shared styles / tokens</text>

  <!-- Control -->
  <rect x="40" y="190" width="820" height="100" rx="10" fill="#fff4e0" stroke="#f59a23" stroke-width="2"/>
  <text x="60" y="218" font-size="18" font-weight="700" fill="#8a5300">CONTROL</text>
  <text x="60" y="238" font-size="13" fill="#334155">features/*/use-*.controller.ts</text>
  <rect x="60" y="248" width="240" height="32" rx="6" fill="#fff" stroke="#f3c176"/>
  <text x="180" y="269" font-size="13" text-anchor="middle" fill="#16213d">Actions (click, drag, refresh…)</text>
  <rect x="330" y="248" width="240" height="32" rx="6" fill="#fff" stroke="#f3c176"/>
  <text x="450" y="269" font-size="13" text-anchor="middle" fill="#16213d">View-model builders</text>
  <rect x="600" y="248" width="240" height="32" rx="6" fill="#fff" stroke="#f3c176"/>
  <text x="720" y="269" font-size="13" text-anchor="middle" fill="#16213d">Auth / session handling</text>

  <!-- Model -->
  <rect x="40" y="370" width="390" height="130" rx="10" fill="#e6f7ee" stroke="#1fb46b" stroke-width="2"/>
  <text x="60" y="398" font-size="18" font-weight="700" fill="#0f6b3f">MODEL</text>
  <text x="60" y="418" font-size="13" fill="#334155">types/ · domain/ · stores/</text>
  <rect x="60" y="430" width="170" height="54" rx="6" fill="#fff" stroke="#8fd6b0"/>
  <text x="145" y="452" font-size="13" text-anchor="middle" fill="#16213d">Domain types</text>
  <text x="145" y="470" font-size="11" text-anchor="middle" fill="#64748b">+ pure business rules</text>
  <rect x="245" y="430" width="170" height="54" rx="6" fill="#fff" stroke="#8fd6b0"/>
  <text x="330" y="452" font-size="13" text-anchor="middle" fill="#16213d">UI stores (Zustand)</text>
  <text x="330" y="470" font-size="11" text-anchor="middle" fill="#64748b">filters · tabs · session</text>

  <!-- Service -->
  <rect x="470" y="370" width="390" height="130" rx="10" fill="#f1eaff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="490" y="398" font-size="18" font-weight="700" fill="#4c2a9e">SERVICE</text>
  <text x="490" y="418" font-size="13" fill="#334155">services/ · TanStack Query cache</text>
  <rect x="490" y="430" width="170" height="54" rx="6" fill="#fff" stroke="#c4b0f5"/>
  <text x="575" y="452" font-size="13" text-anchor="middle" fill="#16213d">Repositories</text>
  <text x="575" y="470" font-size="11" text-anchor="middle" fill="#64748b">mock | http</text>
  <rect x="675" y="430" width="170" height="54" rx="6" fill="#fff" stroke="#c4b0f5"/>
  <text x="760" y="452" font-size="13" text-anchor="middle" fill="#16213d">API client · WebSocket</text>
  <text x="760" y="470" font-size="11" text-anchor="middle" fill="#64748b">DTO → domain mappers</text>

  <!-- Backend -->
  <rect x="470" y="545" width="390" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="665" y="570" font-size="14" text-anchor="middle" fill="#334155">Backend / REST · WebSocket</text>

  <!-- Arrows -->
  <line x1="450" y1="130" x2="450" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="152" font-size="12" fill="#475569">user events (intents)</text>
  <line x1="410" y1="188" x2="410" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 3"/>
  <text x="170" y="164" font-size="12" fill="#475569">view-model props</text>

  <line x1="235" y1="290" x2="235" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="130" y="332" font-size="12" fill="#475569">read / update state</text>
  <line x1="665" y1="290" x2="665" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="677" y="332" font-size="12" fill="#475569">queries / mutations</text>

  <line x1="665" y1="500" x2="665" y2="543" stroke="#475569" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <line x1="470" y1="435" x2="432" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="451" y="428" font-size="11" text-anchor="middle" fill="#475569">domain objects</text>

  <text x="450" y="354" font-size="12" text-anchor="middle" font-style="italic" fill="#64748b">Dependency rule: View → Control → Model / Service. Model never imports Service or UI.</text>
</svg>
